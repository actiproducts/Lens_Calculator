<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ACTi Lens Calculator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace">
        <aside class="requirements" aria-label="Project requirements">
          <div class="brand-block">
            <span class="brand-mark">ACTi</span>
            <div>
              <h1 data-i18n="app_title">Lens Calculator</h1>
              <p data-i18n="app_intro">Find camera models that meet the target distance and surveillance objective.</p>
            </div>
          </div>

          <label class="field language-field">
            <span data-i18n="language">Language</span>
            <select id="language" name="language">
              <option value="en">English</option>
              <option value="es">Español</option>
              <option value="zh_tw">繁體中文</option>
            </select>
          </label>

          <form id="calculator-form" class="control-grid">
            <label class="field">
              <span data-i18n="surveillance_objective">Surveillance objective</span>
              <select id="objective" name="objective"></select>
            </label>

            <label class="field">
              <span data-i18n="distance_to_target">Distance to target</span>
              <input id="distance" name="distance" type="number" min="0.1" step="0.1" value="25" />
            </label>

            <fieldset class="segmented" aria-label="Distance unit">
              <legend data-i18n="unit">Unit</legend>
              <label>
                <input type="radio" name="unit" value="meters" checked />
                <span>m</span>
              </label>
              <label>
                <input type="radio" name="unit" value="feet" />
                <span>ft</span>
              </label>
            </fieldset>

            <label class="field">
              <span data-i18n="lens_type">Lens type</span>
              <select id="lens-type" name="lensType">
                <option value="all" data-i18n="lens_all">All</option>
                <option value="fixed" data-i18n="lens_fixed">Fixed</option>
                <option value="variable" data-i18n="lens_variable">Zoom / varifocal</option>
              </select>
            </label>

            <label class="field">
              <span data-i18n="model_search">Model search</span>
              <input id="model-search" name="modelSearch" type="search" />
            </label>
          </form>

          <section class="quality-panel" aria-labelledby="quality-title">
            <div class="panel-header">
              <h2 id="quality-title" data-i18n="video_quality">Video Quality</h2>
              <button id="open-dori-help" class="link-button" type="button" data-i18n="how_to_choose">How to choose</button>
              <span id="selected-ppm"></span>
            </div>
            <div id="dori-list" class="dori-list"></div>
          </section>
        </aside>

        <section class="results-area" aria-live="polite">
          <div class="toolbar">
            <div>
              <p class="eyebrow" data-i18n="recommendations">Recommendations</p>
              <h2 id="result-count" data-i18n="loading_models">Loading models...</h2>
            </div>
            <label class="field compact">
              <span data-i18n="sort_by">Sort by</span>
              <select id="sort-mode">
                <option value="fit" data-i18n="sort_best_fit">Best fit</option>
                <option value="distance" data-i18n="sort_max_distance">Maximum distance</option>
                <option value="scene" data-i18n="sort_widest_scene">Widest scene</option>
              </select>
            </label>
          </div>

          <div class="summary-strip" id="summary-strip"></div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th data-i18n="table_model">Model</th>
                  <th data-i18n="table_status">Status</th>
                  <th data-i18n="table_lens">Lens</th>
                  <th data-i18n="table_resolution">Resolution</th>
                  <th data-i18n="table_max_distance">Max distance</th>
                  <th data-i18n="table_scene_width">Scene width</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="results-body"></tbody>
            </table>
          </div>
        </section>
      </section>
    </main>

    <dialog id="model-dialog">
      <div class="dialog-header">
        <div>
          <p class="eyebrow" data-i18n="model_details">Model details</p>
          <h2 id="dialog-title"></h2>
        </div>
        <button class="icon-button" id="close-dialog" type="button" aria-label="Close details" data-i18n-aria-label="close_details">x</button>
      </div>
      <div id="dialog-content" class="dialog-content"></div>
    </dialog>

    <dialog id="dori-dialog">
      <div class="dialog-header">
        <div>
          <p class="eyebrow" data-i18n="video_quality_objective">Video Quality / Surveillance Objective</p>
          <h2 data-i18n="choosing_dori_level">Choosing a DORI Level</h2>
        </div>
        <button class="icon-button" id="close-dori-dialog" type="button" aria-label="Close DORI explanation" data-i18n-aria-label="close_dori_explanation">x</button>
      </div>
      <div id="dori-dialog-content" class="dialog-content"></div>
    </dialog>

    <script src="data/temp-db.js"></script>
    <script src="app.js"></script>
  </body>
</html>
